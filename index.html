function lsGet(k,fb){try{var v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function loadProgress(){return lsGet("it_prog",{});}
function saveProgress(kn,le,counts){
  var ka=[],la=[];kn.forEach(function(v){ka.push(v);});le.forEach(function(v){la.push(v);});
  lsSet("it_prog",{known:ka,learning:la,counts:counts||{}});
}
function loadStats(){return lsGet("it_stats",{});}
function saveStats(s){lsSet("it_stats",s);}
function loadPlan(){return lsGet("it_plan",{dailyGoal:10});}
function savePlan(p){lsSet("it_plan",p);}
function todayKey(){return new Date().toISOString().slice(0,10);}
function recordActivity(it,correct){
  var s=loadStats(),k=todayKey();
  if(!s[k])s[k]={seen:0,correct:0,words:[]};
  s[k].seen++;if(correct)s[k].correct++;
  if(s[k].words.indexOf(it)===-1)s[k].words.push(it);
  var keys=Object.keys(s).sort();
  if(keys.length>30)keys.slice(0,keys.length-30).forEach(function(k2){delete s[k2];});
  saveStats(s);
}
function getTodayWords(){var s=loadStats(),k=todayKey();return s[k]?s[k].words||[]:[]; }
function objSum(o,key){var t=0;Object.keys(o).forEach(function(k){t+=o[k][key]||0;});return t;}
function shuffle(arr){var a=arr.slice(),i=a.length,j,t;while(i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function setArr(s){var a=[];s.forEach(function(v){a.push(v);});return a;}
function cs(){var o={};for(var i=0;i<arguments.length;i++){var a=arguments[i];if(a)Object.keys(a).forEach(function(k){o[k]=a[k];});}return o;}

// Italian pronunciation tips
var PRONUC_MAP={
  "ci":"tschi","ce":"tsche","chi":"ki","che":"ke",
  "gi":"dschi","ge":"dsche","ghi":"gi","ghe":"ge",
  "sc":"sch","gli":"lji","gn":"nj","zz":"tz/ds",
  "qu":"kw","uo":"uo","ie":"je"
};
function getPronTips(word){
  var tips=[],low=word.toLowerCase();
  var checks=[["ci","tschi"],["chi","ki"],["gi","dschi"],["ghi","gi"],["sc","sch"],["gli","lji"],["gn","nj"],["zz","tz"],["qu","kw"]];
  for(var i=0;i<checks.length;i++){
    if(low.indexOf(checks[i][0])!==-1){tips.push(checks[i][0]+"="+checks[i][1]);if(tips.length>=2)break;}
  }
  return tips;
}

function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text),vs=window.speechSynthesis.getVoices(),found=null;
  for(var i=0;i<vs.length;i++){if(vs[i].lang.indexOf("it")===0){found=vs[i];break;}}
  if(found)u.voice=found;u.lang="it-IT";u.rate=0.88;
  window.speechSynthesis.speak(u);
}

    h("div",{style:{display:"flex",gap:10,marginBottom:16}},
      [{v:score.r,l:"Giusto",col:GRN},{v:pct+"%",l:"Punteggio",col:GREEN},{v:score.w,l:"Sbagliato",col:RED}].map(function(item){
        return h("div",{key:item.l,style:{flex:1,background:WH,borderRadius:14,padding:"12px 8px",textAlign:"center",boxShadow:SSH}},
          h("div",{style:{fontSize:20,fontWeight:600,color:item.col}},item.v),h("div",{style:{fontSize:11,color:LT}},item.l));

function ProgressScreen(){
  var stats=loadStats(),prog=loadProgress(),known=new Set(prog.known||[]);
  var plan=loadPlan(),tod=stats[todayKey()]||{seen:0,correct:0};
  var r1=useState(plan.dailyGoal),goal=r1[0],setGoal=r1[1];
  var r2=useState(false),saved=r2[0],setSaved=r2[1];
  var totalSeen=objSum(stats,"seen"),totalOk=objSum(stats,"correct");
  var acc=totalSeen?Math.round(totalOk/totalSeen*100):0;
  var kPct=Math.round(known.size/VOCAB.length*100);
  var streak=0,d2=new Date();
  while(true){var k=d2.toISOString().slice(0,10),ss=stats[k];if(ss&&ss.seen>=plan.dailyGoal){streak++;d2.setDate(d2.getDate()-1);}else break;}
  var days=[];
  for(var i=0;i<14;i++){var dd=new Date();dd.setDate(dd.getDate()-(13-i));var dk=dd.toISOString().slice(0,10);var lbl=i===13?"Oggi":dd.toLocaleDateString("it",{weekday:"short"}).slice(0,2);days.push({key:dk,lbl:lbl,data:stats[dk]||{seen:0,correct:0}});}
  var maxS=plan.dailyGoal;

  var catS={};

          h("div",{style:{fontSize:20,fontWeight:600,color:BLK}},kPct+"%"))

        h("div",{style:{fontSize:22,fontWeight:600,color:BLK}},known.size,h("span",{style:{fontSize:14,fontWeight:400,color:LT}}," / "+VOCAB.length)),
        h("div",{style:{fontSize:13,color:GR,marginTop:2}},"Parole imparate"),
        h("div",{style:{display:"flex",gap:20,marginTop:12}},
          h("div",null,h("div",{style:{display:"flex",alignItems:"center",gap:4}},h("span",null,"🔥"),h("span",{style:{fontSize:18,fontWeight:600,color:BLK}},streak)),h("div",{style:{fontSize:11,color:LT}},"Serie")),
          h("div",null,h("div",{style:{fontSize:18,fontWeight:600,color:BLK}},tod.seen),h("div",{style:{fontSize:11,color:LT}},"Oggi")),
          h("div",null,h("div",{style:{fontSize:18,fontWeight:600,color:GRN}},acc+"%"),h("div",{style:{fontSize:11,color:LT}},"Precisione"))
        )

    h("div",{style:cardSt({marginBottom:16})},h("div",{style:lblSt()},"ULTIMI 30 GIORNI"),h("div",{style:{display:"flex",flexWrap:"wrap",gap:5}},dots)),
    h("div",{style:cardSt({marginBottom:16})},
      h("div",{style:lblSt()},"ULTIMI 14 GIORNI"),

        days.map(function(day){
